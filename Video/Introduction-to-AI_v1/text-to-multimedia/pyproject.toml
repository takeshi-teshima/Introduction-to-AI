[project]
name = "text-to-multimedia"
version = "0.1.0"
description = "Speech Markdown (SMD) to audio/video processor using Kokoro TTS"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "numpy",
    "soundfile",
    "kokoro",
    "torch",
    "unidic-lite",
    "pyopenjtalk",
    "fugashi",
    "jaconv",
    "mojimoji",
    "pdf2image",
    "pyyaml",
]

[project.scripts]
text-to-multimedia = "text_to_multimedia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
